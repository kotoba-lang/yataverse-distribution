# Install first so ACME HTTP-01 can issue the independent TLS certificate.
# Keep this virtual host after adding xavier-public-lake.conf.
server {
    listen 80;
    server_name yataverse-data.220-146-170-114.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host:8443$request_uri;
    }
}
