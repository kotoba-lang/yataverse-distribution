# Install as /etc/nginx/conf.d/00-map-hash-bucket.conf. nginx fixes the map
# bucket size when it reads the first map block, so this has to sort before
# every conf.d file that declares a map. 128 holds the 62-character k51 keys
# of yataverse-apps.map; it only enlarges buckets for the existing maps.
map_hash_bucket_size 128;
