# Enable only after certbot has issued the kaisya-domains lineage.
# Shares the rate/connection zones defined by xavier-public-apps.conf.
server {
    listen 443 ssl;
    server_name kaisya.itonami.cloud kaisya.itonami.app;
    ssl_certificate /etc/letsencrypt/live/kaisya-domains/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/kaisya-domains/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_req zone=yataverse_app_reads burst=16 nodelay;
    limit_conn yataverse_app_connections 8;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 10s;

    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host k51qzi5uqu5dlx8n5uqh1tsuwv90nhlm21nez8ljf438e942pgbd20mfeohhgt.ipns.localhost:8080;
        proxy_set_header X-Forwarded-Proto https;
        proxy_redirect http://k51qzi5uqu5dlx8n5uqh1tsuwv90nhlm21nez8ljf438e942pgbd20mfeohhgt.ipns.localhost:8080/ /;
    }
}
