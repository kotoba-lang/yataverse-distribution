# gad standby for xavier-public-apps.conf: same hosts, same allow-list, served
# from gad's Kubo when the router's 443/8443 mapping is moved to gad.
# The certificate is a copy of Xavier's `yataverse-apps` lineage, kept outside
# certbot in /etc/nginx/tls/yataverse-apps/ (gad's certbot timer is off and
# port 80 normally reaches Xavier). Re-copy it after Xavier renews.
#
# Public read-only entrance to static apps named by IPNS, without Cloudflare.
# Each app is its own origin, {k51}.ipns.220-146-170-114.sslip.io, the
# subdomain-gateway form of ADR-2608140500, so apps do not share storage.
# Router maps 80 -> 80 and external 443/8443 -> this host's 443 (SNI-shared).
#
# Only names listed in /etc/nginx/yataverse-apps.map are served: this is not
# an open gateway. The map comes from cloud-itonami
# ops/independent/app-ipfs-publications.json (see README, "Public app
# entrance"). Bytes come from gad's Kubo, where each app is pinned and
# its key is held; the name is resolved by Kubo, not by this file.
limit_req_zone $binary_remote_addr zone=yataverse_app_reads:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=yataverse_app_connections:10m;

# k51 names are 62 characters; the default 64-byte map bucket cannot hold
# them. map_hash_bucket_size must precede the first map nginx reads, so it
# lives in conf.d/00-map-hash-bucket.conf (xavier-map-hash-bucket.conf).
map $yataverse_app_name $yataverse_app_listed {
    default 0;
    include /etc/nginx/yataverse-apps.map;
}

server {
    listen 443 ssl;
    server_name "~^(?<yataverse_app_name>k51[a-z0-9]{59})\.ipns\.220-146-170-114\.sslip\.io$";
    ssl_certificate /etc/nginx/tls/yataverse-apps/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/yataverse-apps/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    limit_req zone=yataverse_app_reads burst=16 nodelay;
    limit_conn yataverse_app_connections 8;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 10s;

    if ($yataverse_app_listed = 0) {
        return 404;
    }
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        # Kubo's built-in subdomain gateway for localhost serves /ipns/<k51>
        # at the root of this Host, so relative and absolute links both work.
        proxy_set_header Host $yataverse_app_name.ipns.localhost:8080;
        proxy_set_header X-Forwarded-Proto https;
        # A directory redirect names the internal Host; keep it on this origin.
        proxy_redirect http://$yataverse_app_name.ipns.localhost:8080/ /;
    }
}
