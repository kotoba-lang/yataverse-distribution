# Install first so ACME HTTP-01 can issue gad's independent TLS certificate.
# Keep this virtual host after adding gad-public-lake.conf. The router's
# external port 80 must point to gad during issue and later renewal.
server {
    listen 80;
    server_name yataverse-data.220-146-170-114.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host:8443$request_uri;
    }
}
