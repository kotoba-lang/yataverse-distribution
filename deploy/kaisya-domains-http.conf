# Install before DNS cutover; retain for certificate renewal.
# Only kaisya's aliases are in scope. IPNS remains canonical.
server {
    listen 80;
    server_name kaisya.itonami.cloud kaisya.itonami.app;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
