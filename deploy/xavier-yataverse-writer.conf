# ADR-2610062000 P5: the public entrance the Cloudflare Worker uses to reach
# yataverse-writer on main-2 (tailnet 100.108.223.94:18130). The writer accepts
# only graph heads signed by the pinned namespace signer, so this entrance is
# rate-limited and size-limited rather than authenticated. GET and POST only.
server {
    listen 443 ssl;
    server_name yataverse-writer.220-146-170-114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/yataverse-writer.220-146-170-114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yataverse-writer.220-146-170-114.sslip.io/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    limit_req zone=yataverse_writer burst=10 nodelay;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
    proxy_send_timeout 30s;
    location = /health { proxy_pass http://100.108.223.94:18130/health; }
    location = /v1/graph-head {
        limit_except GET POST { deny all; }
        proxy_pass http://100.108.223.94:18130/v1/graph-head;
    }
    location / { return 404; }
}
