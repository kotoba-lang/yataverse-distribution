# ADR-2610062000 P5: the public entrance the Cloudflare Worker uses to reach
# yataverse-writer. The writer accepts only graph heads signed by the pinned
# namespace signer, so this entrance is rate-limited and size-limited rather
# than authenticated. GET and POST only.
#
# Two writers, each with its own key in the witnesses' writer policy
# (2026-10-07): xavier's own (loopback) first, main-2's when xavier's is down.
# main-2 sits behind NAT with no inbound address. It keeps an outbound libp2p
# connection to xavier's Kubo (Peering), and xavier opens the writer protocol
# /x/yataverse/graph-head/1 over it at 127.0.0.1:18131 (p2p_mount.py
# --forward-to). The backup path therefore uses neither the tailnet nor DNS. A POST is retried on the other writer only when the first
# could not be reached or timed out. That is safe because a write is
# idempotent across writers: the same head builds the same document, and a
# writer that finds its head already committed answers 200.
upstream yataverse_writers {
    server 127.0.0.1:18130 max_fails=2 fail_timeout=30s;
    server 127.0.0.1:18131 backup;
}
server {
    listen 443 ssl;
    server_name yataverse-writer.220-146-170-114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/yataverse-writer.220-146-170-114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yataverse-writer.220-146-170-114.sslip.io/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Yataverse-Writer $upstream_addr always;
    limit_req zone=yataverse_writer burst=10 nodelay;
    client_max_body_size 16k;
    proxy_connect_timeout 5s;
    proxy_read_timeout 900s;
    proxy_send_timeout 30s;
    proxy_next_upstream error timeout non_idempotent;
    proxy_next_upstream_tries 2;
    location = /health { proxy_pass http://yataverse_writers/health; }
    location = /v1/graph-head {
        limit_except GET POST { deny all; }
        proxy_pass http://yataverse_writers/v1/graph-head;
    }
    location / { return 404; }
}
