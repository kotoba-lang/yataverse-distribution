# Install first so ACME HTTP-01 can issue the apps certificate.
# Keep this virtual host after adding xavier-public-apps.conf.
# One host per app IPNS name: {k51}.ipns.220-146-170-114.sslip.io.
server {
    listen 80;
    server_name "~^k51[a-z0-9]{59}\.ipns\.220-146-170-114\.sslip\.io$";

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
