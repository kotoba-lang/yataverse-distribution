# Prepared Yataverse entrance; NOT installed by the P2P reader activation.
# Install after issuing a certificate for yataverse.com and ipfs.yataverse.com.
# Verify WAN ports 80/443 reach this Nginx. Share 443 by SNI with existing sites.
# The inventory covers the dated lake; block bytes are available only after
# local pin verification in serve_lake.py. Prove full custody with an audit.
limit_req_zone $binary_remote_addr zone=yataverse_entry_reads:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=yataverse_entry_connections:10m;

server {
    listen 443 ssl;
    server_name yataverse.com ipfs.yataverse.com;
    ssl_certificate /etc/letsencrypt/live/yataverse.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yataverse.com/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Yataverse-Inventory-Scope dated-full always;
    add_header X-Yataverse-Bytes-Scope local-pinned-only always;
    add_header Access-Control-Allow-Origin "*" always;
    add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
    add_header Access-Control-Allow-Headers "Accept, Content-Type" always;
    add_header Access-Control-Expose-Headers "Content-Length, X-Yataverse-Inventory-Scope, X-Yataverse-Bytes-Scope" always;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Expose-Headers;
    limit_req zone=yataverse_entry_reads burst=16 nodelay;
    limit_conn yataverse_entry_connections 8;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 10s;

    if ($request_method = OPTIONS) {
        return 204;
    }
    if ($request_method != GET) {
        return 405;
    }

    location = / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host k51qzi5uqu5dlrtqhevrfpyrdr2c1thxug3iqys76xxbi7bgzm16mjti2bwrf2.ipns.localhost:8080;
    }
    location = /health {
        proxy_pass http://127.0.0.1:8090;
    }
    location = /api/v1/lake/blocks {
        proxy_pass http://127.0.0.1:8090;
    }
    location ^~ /ipfs/ {
        proxy_pass http://127.0.0.1:8090;
    }
    location / {
        return 404;
    }
}
