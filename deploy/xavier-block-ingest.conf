# Public entrance for block-ingest (deploy/block_ingest.cljk). Writes are
# authenticated by the service itself (Ed25519 signature from an allowlisted
# did:key); reads are public, CID-checked, immutable. 16 MiB matches
# --max-block-bytes; murakumo chunks larger objects.
limit_req_zone $binary_remote_addr zone=block_ingest:10m rate=20r/s;
server {
    listen 443 ssl;
    server_name yataverse-blocks.220-146-170-114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/yataverse-blocks.220-146-170-114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yataverse-blocks.220-146-170-114.sslip.io/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    limit_req zone=block_ingest burst=40 nodelay;
    client_max_body_size 16m;
    proxy_request_buffering on;
    proxy_connect_timeout 5s;
    proxy_read_timeout 120s;
    proxy_send_timeout 120s;
    location = /health { proxy_pass http://127.0.0.1:18140/health; }
    location ~ ^/v1/blocks/b[a-z2-7]{58}$ {
        limit_except GET HEAD PUT DELETE { deny all; }
        proxy_pass http://127.0.0.1:18140;
    }
    location / { return 404; }
}
