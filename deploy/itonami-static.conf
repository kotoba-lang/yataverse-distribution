# Dated, read-only Itonami public snapshot on each node's own Kubo gateway.
# The CID is fixed until a separately verified publication updates this file.
# The public DNS name is temporary; it is not itonami.cloud.
server {
    listen 80;
    server_name itonami-static.220-146-170-114.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host:8443$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name itonami-static.220-146-170-114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/itonami-static.220-146-170-114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/itonami-static.220-146-170-114.sslip.io/privkey.pem;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Itonami-Snapshot-CID bafybeiakpbytknldt2ngl2nl7ggpjw3kgubpuuj3whdjw3vva3zcfjj43a always;

    if ($request_method != GET) {
        return 405;
    }
    location ^~ /api/ {
        return 503;
    }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host bafybeiakpbytknldt2ngl2nl7ggpjw3kgubpuuj3whdjw3vva3zcfjj43a.ipfs.localhost:8080;
        proxy_read_timeout 30s;
    }
}
