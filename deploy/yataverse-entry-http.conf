# Install first so ACME HTTP-01 can issue the independent TLS certificate.
# Keep this virtual host after adding xavier-public-lake.conf.
server {
    listen 80;
    server_name yataverse.com ipfs.yataverse.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://$host$request_uri;
    }
}
