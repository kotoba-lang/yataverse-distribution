# Standby public read-only entry to gad's dated local lake inventory and pinned blocks.
# Install after a certificate is issued for this name. Router maps 80 -> 80
# and external 8443 -> this host's 443 during a manual takeover. Port 443 is
# shared by SNI with Isekai.
# The inventory covers the dated lake; block bytes are available only after
# local pin verification in serve_lake.py. Do not advertise this as a full mirror.
limit_req_zone $binary_remote_addr zone=yataverse_lake_reads:10m rate=8r/s;
limit_conn_zone $binary_remote_addr zone=yataverse_lake_connections:10m;

server {
    listen 443 ssl;
    server_name yataverse-data.220-146-170-114.sslip.io;
    ssl_certificate /etc/letsencrypt/live/yataverse-data.220-146-170-114.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yataverse-data.220-146-170-114.sslip.io/privkey.pem;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Yataverse-Inventory-Scope dated-full always;
    add_header X-Yataverse-Bytes-Scope local-pinned-only always;
    limit_req zone=yataverse_lake_reads burst=16 nodelay;
    limit_conn yataverse_lake_connections 8;
    proxy_connect_timeout 3s;
    proxy_read_timeout 45s;
    proxy_send_timeout 10s;

    if ($request_method != GET) {
        return 405;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18090;
    }
    location = /api/v1/lake/blocks {
        proxy_pass http://127.0.0.1:18090;
    }
    location ^~ /ipfs/ {
        proxy_pass http://127.0.0.1:18090;
    }
    location / {
        return 404;
    }
}
